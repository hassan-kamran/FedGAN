# FedGAN Experiment Configuration: Diabetic Retinopathy
# This configuration replicates the original experiment setup

name: fedgan_retinopathy_5clients
description: |
  Federated GAN for diabetic retinopathy image generation.
  Training on non-IID data splits across 5 clients.

seed: 42

model:
  latent_dim: 200
  learning_rate: 0.0002
  beta_1: 0.5
  beta_2: 0.999
  generator_filters: [1024, 512, 256, 128, 64, 32]
  discriminator_filters: [64, 128, 256, 512, 1024]
  use_batch_norm: true
  batch_norm_momentum: 0.1
  activation: leaky_relu
  leaky_relu_alpha: 0.2

data:
  image_size: 128
  channels: 1  # Grayscale
  batch_size: 16
  clip_limit: 2.0
  tile_grid_size: [8, 8]
  gamma: 1.5
  bin_size: 16
  normalization_range: [-1.0, 1.0]
  shuffle_buffer_size: 1000
  prefetch_size: 2

federated:
  num_clients: 5
  local_epochs: 5
  federated_rounds: 2
  aggregation_strategy: fedavg
  client_selection_strategy: all
  client_selection_fraction: 1.0
  min_clients_per_round: 5
  use_differential_privacy: false

paths:
  data_dir: data/train-val-test/non_iid_clusters_5
  model_dir: models/federated_5clients
  log_dir: logs/federated_5clients
  output_dir: outputs/federated_5clients
  checkpoint_dir: checkpoints/federated_5clients

metadata:
  dataset: diabetic_retinopathy
  data_source: kaggle
  preprocessing: CLAHE + gamma correction + pixel binning
  publication: PLOS ONE
